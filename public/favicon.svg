<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1736" />
      <stop offset="100%" stop-color="#050a1a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Container Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Stylized Equality & Diversity Icon: Intersecting arcs and balanced pillars -->
  <!-- Top decorative diversity dots -->
  <circle cx="20" cy="19" r="4.5" fill="url(#brandGrad)" />
  <circle cx="44" cy="19" r="4.5" fill="url(#roseGrad)" />
  <circle cx="32" cy="14" r="3.5" fill="url(#amberGrad)" />

  <!-- Balanced Arch / Scales representing Institutional Equity -->
  <path d="M16 28 C22 24, 42 24, 48 28" stroke="url(#brandGrad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M32 23 V48" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Equality Bars (=) with glowing rounded ends -->
  <rect x="20" y="34" width="24" height="4" rx="2" fill="url(#brandGrad)" />
  <rect x="20" y="42" width="24" height="4" rx="2" fill="url(#roseGrad)" />

  <!-- Base platform -->
  <path d="M22 51 H42" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
</svg>
